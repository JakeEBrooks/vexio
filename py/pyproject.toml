[project]
name = "vexio"
version = "0.1.0"
description = "Python bindings for the vexio VEX library"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "."
module-name = "vexio._vexio"
