[package]
name = "vexio"
version = "0.1.1"
authors = ["Jacob Brooks <jacobbrooks312@gmail.com>"]
description = "The friendliest VLBI Experiment (VEX) file support library"
repository = "https://github.com/JakeEBrooks/vexio"
keywords = ["parser", "parsing", "text", "file", "io", "science"]
edition = "2024"

[dependencies]
thiserror = "2"
miette = { version = "7", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
miette = ["dep:miette"]

[workspace]
members = [".", "py"]
